name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv venv && uv pip install -e .
      # judgeguard gating judgeguard. The bundled corpus ships a live prompt
      # injection against the naive candidate, so this job is expected to fail
      # until a guarded candidate lands - which is the point of the demo.
      - run: uv run judgeguard gate --provider bm25
        continue-on-error: true
      - run: uv run judgeguard bakeoff --a canned --b bm25
